services:

  nexus1:
    build: ./nexus
    container_name: nexus1
    ports:
      - "8081:8081"
    volumes:
      - nexus-data:/nexus-data
    networks:
      - k-n_net 

  jenkins_c:
    build: ./jenkins
    container_name: jenkins_c
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/jenkins-data
      - /var/run/docker.sock:/var/run/docker.sock # -> part of assignment, necessary
    networks:
      - k-n_net

#  jenkins_agent1:
#    image: jenkins/inbound-agent:latest
#    container_name: jenkins_agent1
#    environment:
#      - JENKINS_URL=http://jenkins_c:8080/
#      - JENKINS_AGENT_NAME=agent_1
#      - JENKINS_SECRET="${JENKINS_SEC}"
#      - JENKINS_AGENT_WORKDIR=/home/jenkins/agent
#    depends_on:
#      - jenkins_c
#    networks:
#      - k-n_net

  test1:
    build: 
      context: ./test
    container_name: test1
    ports:
      - "8082:8080"
      - "2223:22"
    networks:
      - k-n_net

  prod1:
    build: 
      context: ./prod
    container_name: prod1
    ports:
      - "8083:8080"
      - "2224:22"
    networks:
      - k-n_net
  
  sonarqube1:
    image: sonarqube:latest
    container_name: sonarqube1
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar-data:/opt/sonarqube/data
    networks:
      - k-n_net

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/loki-config.yaml
    networks:
      - k-n_net

  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ./promtail/config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - k-n_net

  grafana:
    image: grafana/grafana:10.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - k-n_net

networks:
  k-n_net:
    driver: bridge

volumes:
  nexus-data:
  jenkins-data:
  sonar-data:
